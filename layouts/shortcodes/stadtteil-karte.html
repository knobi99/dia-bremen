<div class="standort-karte">
    <div class="standort-karte-kopf">
        <span class="standort-nummer">{{ .Get "nummer" }}</span>
        <h3 class="stadtteil-name"><a href="{{ .Get "link" }}">{{ .Get "stadtteil" }}</a></h3>
    </div>
    <div class="stadtteil-venues">
        {{ .Inner }}
    </div>
    <a href="{{ .Get "link" }}" class="standort-link">{{ .Get "linktext" | default "Mehr erfahren →" }}</a>
</div>
