{{ define "main" }}

<div class="page-hero" role="presentation" aria-hidden="true"{{ with .Params.hero_image }} data-image="{{ . }}"{{ end }}{{ with $.Params.hero_position }} style="background-position: {{ . }};"{{ end }}></div>

<article class="content-page">
    <div class="content-wrapper">

        <h1>{{ .Params.h1 | default .Title }}</h1>

        {{ $img := or .Params.featured_image .Params.image }}
        {{ with $img }}
        <div class="article-image">
            <img src="{{ . }}" alt="{{ $.Params.image_alt | default $.Title }}">
        </div>
        {{ end }}

        {{ .Content }}

        {{ if eq .Section "impulse" }}
        <p class="artikel-standorte-hinweis">Haben Sie noch Fragen dazu? Kommen Sie einfach zu einer <a href="/standorte/">Sprechstunde in Ihrer Nähe</a>.</p>
        {{ end }}

    </div>
</article>

{{ end }}
