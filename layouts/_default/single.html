{{ define "main" }}

<article class="content-page">
    <div class="content-wrapper">

        <h1>{{ .Title }}</h1>

        {{ with .Params.featured_image }}
        <div class="article-image">
            <img src="{{ . }}" alt="{{ $.Title }}">
        </div>
        {{ end }}

        {{ .Content }}

    </div>
</article>

{{ end }}
