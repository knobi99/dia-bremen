{{ define "main" }}

<div class="page-hero" role="presentation" aria-hidden="true"{{ with .Params.hero_image }} data-image="{{ . }}"{{ end }}></div>

<article class="content-page">
    <div class="content-wrapper">

        <h1>{{ .Title }}</h1>

        {{ $img := or .Params.featured_image .Params.image }}
        {{ with $img }}
        <div class="article-image">
            <img src="{{ . }}" alt="{{ $.Title }}">
        </div>
        {{ end }}

        {{ .Content }}

    </div>
</article>

{{ end }}
