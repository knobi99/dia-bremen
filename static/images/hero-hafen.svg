<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 500">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0903a"/>
      <stop offset="60%" style="stop-color:#5a9bc4"/>
      <stop offset="100%" style="stop-color:#2d6a8a"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e5f7a"/>
      <stop offset="100%" style="stop-color:#0d3347"/>
    </linearGradient>
  </defs>
  <!-- Himmel -->
  <rect width="1400" height="500" fill="url(#sky)"/>
  <!-- Wolken -->
  <ellipse cx="220" cy="80" rx="110" ry="38" fill="rgba(255,255,255,0.18)"/>
  <ellipse cx="310" cy="65" rx="80" ry="30" fill="rgba(255,255,255,0.14)"/>
  <ellipse cx="900" cy="95" rx="140" ry="42" fill="rgba(255,255,255,0.15)"/>
  <ellipse cx="1050" cy="75" rx="90" ry="32" fill="rgba(255,255,255,0.12)"/>
  <!-- Horizont / Hafengebäude Silhouetten -->
  <rect x="0" y="260" width="1400" height="240" fill="url(#water)"/>
  <!-- Kaimauer -->
  <rect x="0" y="255" width="1400" height="20" fill="#1a3a2e" opacity="0.8"/>
  <!-- Gebäude links -->
  <rect x="40" y="160" width="70" height="98" fill="#1a2e3a" opacity="0.75"/>
  <rect x="55" y="140" width="40" height="22" fill="#1a2e3a" opacity="0.75"/>
  <rect x="120" y="185" width="90" height="72" fill="#1a2e3a" opacity="0.7"/>
  <rect x="220" y="170" width="55" height="87" fill="#1a2e3a" opacity="0.72"/>
  <rect x="235" y="148" width="28" height="24" fill="#1a2e3a" opacity="0.72"/>
  <!-- Gebäude rechts -->
  <rect x="1050" y="175" width="80" height="82" fill="#1a2e3a" opacity="0.7"/>
  <rect x="1140" y="155" width="65" height="102" fill="#1a2e3a" opacity="0.72"/>
  <rect x="1215" y="178" width="90" height="79" fill="#1a2e3a" opacity="0.68"/>
  <rect x="1315" y="165" width="70" height="92" fill="#1a2e3a" opacity="0.7"/>
  <!-- Kran / Mast -->
  <line x1="600" y1="100" x2="600" y2="258" stroke="#1a2e3a" stroke-width="6" opacity="0.65"/>
  <line x1="560" y1="130" x2="660" y2="130" stroke="#1a2e3a" stroke-width="5" opacity="0.55"/>
  <line x1="600" y1="130" x2="660" y2="220" stroke="#1a2e3a" stroke-width="3" opacity="0.45"/>
  <!-- Boot links -->
  <ellipse cx="350" cy="258" rx="90" ry="14" fill="#2a4a5a" opacity="0.7"/>
  <rect x="290" y="228" width="120" height="32" rx="4" fill="#2a4a5a" opacity="0.65"/>
  <line x1="360" y1="228" x2="360" y2="175" stroke="#c0845a" stroke-width="4" opacity="0.6"/>
  <!-- Boot rechts -->
  <ellipse cx="980" cy="256" rx="110" ry="16" fill="#2a3a4a" opacity="0.65"/>
  <rect x="910" y="222" width="140" height="36" rx="5" fill="#2a3a4a" opacity="0.6"/>
  <line x1="960" y1="222" x2="960" y2="162" stroke="#c0845a" stroke-width="4" opacity="0.55"/>
  <line x1="1010" y1="222" x2="1010" y2="172" stroke="#c0845a" stroke-width="3" opacity="0.5"/>
  <!-- Wasserspiegelung -->
  <rect x="0" y="270" width="1400" height="8" fill="rgba(255,170,80,0.15)"/>
  <rect x="200" y="285" width="300" height="4" fill="rgba(255,170,80,0.1)"/>
  <rect x="800" y="300" width="250" height="4" fill="rgba(255,170,80,0.1)"/>
  <!-- Sonnenschein-Reflex auf Wasser -->
  <ellipse cx="700" cy="310" rx="180" ry="18" fill="rgba(255,160,60,0.12)"/>
</svg>
